name: Build ZXTouch Package

run-name: v3.1.37

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-app:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Cache Xcode DerivedData
        uses: actions/cache@v4
        with:
          path: ~/Library/Developer/Xcode/DerivedData
          key: xcode-deriveddata-${{ runner.os }}-${{ hashFiles('zxtouch/zxtouch.xcodeproj/project.pbxproj') }}

      - name: Build iOS App
        run: |
          set -o pipefail
          xcodebuild \
            -project zxtouch/zxtouch.xcodeproj \
            -target zxtouch \
            -sdk iphoneos \
            -configuration Release \
            SYMROOT="$(pwd)/app-build" \
            ONLY_ACTIVE_ARCH=NO \
            ARCHS="arm64 arm64e" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            PRODUCT_BUNDLE_IDENTIFIER=com.zjx.zxtouch \
            2>&1 | tee xcode_build.log | grep -E "error:|warning:|BUILD (SUCCEEDED|FAILED)|Compiling|Linking" | tail -40
          APP=$(find ./app-build -name "zxtouch.app" -type d | head -1)
          echo "APP=$APP"

      - name: Upload Xcode build log (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcode-build-log
          path: xcode_build.log

      - name: Sign and archive App
        run: |
          APP=$(find ./app-build -name "zxtouch.app" -type d | head -1)
          echo "App found at: $APP"
          brew install ldid 2>/dev/null || true
          ldid -Szxtouch/app-entitlements.plist "$APP/zxtouch"
          EXT="$APP/PlugIns/shortcutext.appex/shortcutext"
          if [ -f "$EXT" ]; then
            ldid -Szxtouch/shortcutext-entitlements.plist "$EXT"
            echo "Signed extension"
          fi
          tar -czf zxtouch-app.tar.gz -C "$(dirname "$APP")" "$(basename "$APP")"
          ls -la zxtouch-app.tar.gz

      - name: Upload zxtouch.app
        uses: actions/upload-artifact@v4
        with:
          name: zxtouch-app
          path: zxtouch-app.tar.gz
          if-no-files-found: error

  build-theos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-${{ runner.os }}-v1
          restore-keys: |
            ccache-${{ runner.os }}-

      - name: Install ccache
        run: brew install ccache

      - name: Cache roothide Theos
        id: cache-theos
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/theos
          key: roothide-theos-${{ runner.os }}-v4

      - name: Install roothide Theos
        if: steps.cache-theos.outputs.cache-hit != 'true'
        run: bash -c "$(curl -fsSL https://raw.githubusercontent.com/roothide/theos/master/bin/install-theos)"
        env:
          THEOS: ${{ github.workspace }}/theos
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install ldid
        run: brew install ldid

      - name: Build Rootless .deb
        run: |
          export CC="ccache clang"
          export CXX="ccache clang++"
          export CCACHE_BASEDIR="$GITHUB_WORKSPACE"
          export CCACHE_MAXSIZE="2G"
          export CCACHE_SLOPPINESS="file_macro,include_file_mtime,include_file_ctime,pch_defines,time_macros"
          ccache -s || true
          rm -rf .theos packages out
          cp -f control-rootless control
          ls -l control control-rootless || true
          make -j$(sysctl -n hw.ncpu) package THEOS_PACKAGE_SCHEME=rootless FINALPACKAGE=1
          local_rc=$?
          ccache -s || true
          ls -la packages/ 2>/dev/null || echo "(packages/ does not exist)"
          mkdir -p out
          cp packages/*.deb out/rootless.deb
          exit $local_rc
        env:
          THEOS: ${{ github.workspace }}/theos

      - name: Build Rootful .deb
        run: |
          export CC="ccache clang"
          export CXX="ccache clang++"
          export CCACHE_BASEDIR="$GITHUB_WORKSPACE"
          export CCACHE_MAXSIZE="2G"
          export CCACHE_SLOPPINESS="file_macro,include_file_mtime,include_file_ctime,pch_defines,time_macros"
          ccache -s || true
          rm -rf .theos packages
          cp -f control-rootful control
          ls -l control control-rootful || true
          make -j$(sysctl -n hw.ncpu) package FINALPACKAGE=1
          local_rc=$?
          ccache -s || true
          ls -la packages/ 2>/dev/null || echo "(packages/ does not exist)"
          cp packages/*.deb out/rootful.deb
          exit $local_rc
        env:
          THEOS: ${{ github.workspace }}/theos

      - name: Upload theos debs
        uses: actions/upload-artifact@v4
        with:
          name: theos-deb
          path: out/
          if-no-files-found: error

  assemble:
    needs: [build-app, build-theos]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download zxtouch.app
        uses: actions/download-artifact@v4
        with:
          name: zxtouch-app
          path: downloads

      - name: Download theos debs
        uses: actions/download-artifact@v4
        with:
          name: theos-deb
          path: downloads

      - name: Assemble final artifacts
        run: |
          set -euo pipefail
          brew install dpkg 2>/dev/null || true
          echo "=== downloads/ contents ==="
          ls -la downloads/
          tar -xzf downloads/zxtouch-app.tar.gz
          mkdir -p final
          VERSION=$(dpkg-deb -f downloads/rootless.deb Version)
          echo "VERSION=$VERSION"
          build_deb() {
            DEB="$1"
            APP_DEST="$2"
            OUT_NAME="$3"
            rm -rf deb-root
            dpkg-deb -x "$DEB" deb-root/
            dpkg-deb -e "$DEB" deb-root/DEBIAN/
            mkdir -p "deb-root/$(dirname "$APP_DEST")"
            cp -R zxtouch.app "deb-root/$APP_DEST"
            chmod -R 755 "deb-root/$APP_DEST"
            dpkg-deb --root-owner-group -b deb-root "final/$OUT_NAME"
          }
          build_deb downloads/rootless.deb "var/jb/Applications/zxtouch.app" "小新Lap_${VERSION}（无根rootless）.deb"
          build_deb downloads/rootful.deb "Applications/zxtouch.app" "小新Lap_${VERSION}（有根rootful）.deb"
          rm -rf deb-root zxtouch.app
          ls -la final/

      - name: Upload final artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ZXTouch-final
          path: final/
          if-no-files-found: error

      - name: Publish Release with the two debs
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION=$(jq -r '.version' version.json)
          echo "VERSION=$VERSION"
          TAG="v${VERSION}"
          RL="final/小新Lap_${VERSION}（无根rootless）.deb"
          RF="final/小新Lap_${VERSION}（有根rootful）.deb"

          cat > release-notes.md <<EOF
          ## 小新Lap ${VERSION}

          | File | 用途 | 越狱 | iOS |
          |------|------|------|-----|
          | \`小新Lap_${VERSION}（无根rootless）.deb\` | 无根越狱一键安装（含 App + 触摸引擎） | Dopamine, Dopamine 3, NathanLR | 15.0 - 17.7 |
          | \`小新Lap_${VERSION}（有根rootful）.deb\` | 有根越狱一键安装（含 App + 触摸引擎） | palera1n (rootful), checkra1n | 15.0 - 16.x |

          ### 安装
          1. 下载对应自己越狱方式的 \`.deb\`
          2. 用 Filza 打开安装，或 SSH 执行 \`dpkg -i <file>.deb && killall SpringBoard\`

          > \`.py\` 脚本需要 Procursus 源的 Python 3。
          EOF

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$TAG" --notes-file release-notes.md
          else
            gh release create "$TAG" --title "$TAG" --notes-file release-notes.md
          fi
          gh release view "$TAG" --json assets --jq '.assets[].name' > release-assets.txt
          while IFS= read -r asset; do
            if [ -n "$asset" ]; then gh release delete-asset "$TAG" "$asset" --yes; fi
          done < release-assets.txt
          gh release upload "$TAG" "$RL" "$RF" --clobber
          gh release view "$TAG" --json assets --jq '.assets[].name'