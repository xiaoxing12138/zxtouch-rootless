name: Build ZXTouch Package

run-name: v3.1.2

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-app:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Cache Xcode DerivedData
        uses: actions/cache@v4
        with:
          path: ~/Library/Developer/Xcode/DerivedData
          key: xcode-deriveddata-${{ runner.os }}-${{ hashFiles('zxtouch/zxtouch.xcodeproj/project.pbxproj') }}

      - name: Build iOS App
        run: |
          set -o pipefail
          xcodebuild \
            -project zxtouch/zxtouch.xcodeproj \
            -target zxtouch \
            -sdk iphoneos \
            -configuration Release \
            SYMROOT="$(pwd)/app-build" \
            ONLY_ACTIVE_ARCH=NO \
            ARCHS="arm64 arm64e" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            PRODUCT_BUNDLE_IDENTIFIER=com.zjx.zxtouch \
            2>&1 | tee xcode_build.log | grep -E "error:|warning:|BUILD (SUCCEEDED|FAILED)|Compiling|Linking" | tail -40
          APP=$(find ./app-build -name "zxtouch.app" -type d | head -1)
          echo "APP=$APP"

      - name: Upload Xcode build log (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcode-build-log
          path: xcode_build.log

      - name: Sign and archive App
        run: |
          APP=$(find ./app-build -name "zxtouch.app" -type d | head -1)
          echo "App found at: $APP"
          brew install ldid 2>/dev/null || true
          ldid -Szxtouch/app-entitlements.plist "$APP/zxtouch"
          EXT="$APP/PlugIns/shortcutext.appex/shortcutext"
          if [ -f "$EXT" ]; then
            ldid -Szxtouch/shortcutext-entitlements.plist "$EXT"
            echo "Signed extension"
          fi
          tar -czf zxtouch-app.tar.gz -C "$(dirname "$APP")" "$(basename "$APP")"
          ls -la zxtouch-app.tar.gz

      - name: Upload zxtouch.app
        uses: actions/upload-artifact@v4
        with:
          name: zxtouch-app
          path: zxtouch-app.tar.gz
          if-no-files-found: error

  build-theos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-${{ runner.os }}-v1
          restore-keys: |
            ccache-${{ runner.os }}-

      - name: Install ccache
        run: brew install ccache

      - name: Cache roothide Theos
        id: cache-theos
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/theos
          key: roothide-theos-${{ runner.os }}-v4

      - name: Install roothide Theos
        if: steps.cache-theos.outputs.cache-hit != 'true'
        run: bash -c "$(curl -fsSL https://raw.githubusercontent.com/roothide/theos/master/bin/install-theos)"
        env:
          THEOS: ${{ github.workspace }}/theos
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install ldid
        run: brew install ldid

      - name: Build Rootless .deb
        run: |
          export CC="ccache clang"
          export CXX="ccache clang++"
          export CCACHE_BASEDIR="$GITHUB_WORKSPACE"
          export CCACHE_MAXSIZE="2G"
          export CCACHE_SLOPPINESS="file_macro,include_file_mtime,include_file_ctime,pch_defines,time_macros"
          ccache -s || true
          make -j$(sysctl -n hw.ncpu) package THEOS_PACKAGE_SCHEME=rootless FINALPACKAGE=1
          local_rc=$?
          ccache -s || true
          ls -la packages/ 2>/dev/null || echo "(packages/ does not exist)"
          exit $local_rc
        env:
          THEOS: ${{ github.workspace }}/theos

      - name: Upload Rootless deb skeleton
        uses: actions/upload-artifact@v4
        with:
          name: theos-deb
          path: packages/*.deb
          if-no-files-found: error

  assemble:
    needs: [build-app, build-theos]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download zxtouch.app
        uses: actions/download-artifact@v4
        with:
          name: zxtouch-app
          path: downloads

      - name: Download theos deb
        uses: actions/download-artifact@v4
        with:
          name: theos-deb
          path: downloads

      - name: Assemble final artifacts
        run: |
          set -euo pipefail
          brew install zip 2>/dev/null || true
          brew install dpkg 2>/dev/null || true
          echo "=== downloads/ contents ==="
          ls -la downloads/
          DEB=$(find downloads -maxdepth 2 -name "*.deb" | head -1)
          echo "DEB=$DEB"
          mkdir -p final
          tar -xzf downloads/zxtouch-app.tar.gz
          rm -rf deb-root
          dpkg-deb -x "$DEB" deb-root/
          dpkg-deb -e "$DEB" deb-root/DEBIAN/
          VERSION=$(awk '/^Version:/{print $2}' deb-root/DEBIAN/control)
          echo "VERSION=$VERSION"
          mkdir -p deb-root/var/jb/Applications
          cp -R zxtouch.app deb-root/var/jb/Applications/zxtouch.app
          chmod -R 755 deb-root/var/jb/Applications/zxtouch.app
          dpkg-deb --root-owner-group -b deb-root "final/小新Lap_${VERSION}_rootless.deb"
          mkdir -p Payload
          cp -R zxtouch.app Payload/
          zip -rq "final/小新Lap_${VERSION}.ipa" Payload
          rm -rf Payload deb-root
          ls -la final/

      - name: Upload final artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ZXTouch-final
          path: final/
          if-no-files-found: error

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            final/*_rootless.deb
            final/*.ipa
          generate_release_notes: true
          append_body: true
          body: |
            ## ZXTouch Rootless

            | File | 用途 | Jailbreak | iOS |
            |------|------|-----------|-----|
            | `*_rootless.deb` | 一键安装（含 App + 触摸引擎） | Dopamine, Dopamine 3, NathanLR | 15.0 - 17.7 |
            | `*.ipa` | 可选：TrollStore 侧载 App | 任意 | 任意 |

            ### Installation
            1. Download the `.deb` for your jailbreak
            2. Install via Filza or SSH: `dpkg -i <file>.deb && killall SpringBoard`

            > Python 3 from Procursus is required for `.py` scripts.
